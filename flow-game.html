<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Game Facilitator</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --text: #1b1f24; --muted: #5b6470;
  --border: #d8dce2; --accent: #2f6fde; --accent-ink: #ffffff; --danger: #d43a3a; --good: #1d8a4b;
  --warn: #a86a12; --r1: #c2510c; --r2: #0e7490; --hot: #fff1b8; --hot-ink: #5c4400;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 3px 10px rgb(0 0 0 / .05);
  --card-ink: #1b1f24;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #191d23; --surface-2: #222830; --text: #e7eaee; --muted: #9aa3ae;
    --border: #313945; --accent: #6ea2ff; --accent-ink: #0b1220; --danger: #ff6b6b; --good: #4ade80;
    --warn: #f5b84b; --r1: #fb923c; --r2: #22d3ee; --hot: #3d3510; --hot-ink: #ffe28a;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #191d23; --surface-2: #222830; --text: #e7eaee; --muted: #9aa3ae;
  --border: #313945; --accent: #6ea2ff; --accent-ink: #0b1220; --danger: #ff6b6b; --good: #4ade80;
  --warn: #f5b84b; --r1: #fb923c; --r2: #22d3ee; --hot: #3d3510; --hot-ink: #ffe28a;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.num, .big-clock, td.n, .tile b { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85em; }

/* Header */
header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.mini { font-size: .85rem; padding: 2px 8px; border-radius: 99px; background: var(--danger); color: #fff; display: none; }
.mini.on { display: inline-block; }
nav.tabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 600; }
nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }

/* Layout */
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.span-all { grid-column: 1 / -1; }
.grid.charts { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.grid.run { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 800px) { .grid.run { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.run > .idle-card { grid-column: 1 / -1; } }
@media (min-width: 1200px) { .grid.run { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid.run > .idle-card { grid-column: span 2; } }
.grid.pair { grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card > h2, .card > h3 { margin-bottom: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack-v > * + * { margin-top: 10px; }
.sp { flex: 1; }

/* Buttons */
.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; line-height: 1.2; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.confirming { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.big { padding: 14px 18px; font-size: 1.1rem; border-radius: 10px; }
.btn.sm { padding: 4px 8px; font-size: .85rem; }
.btn.on { background: var(--surface-2); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.active { background: var(--accent); color: var(--accent-ink); }

/* Tiles */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile span { display: block; font-size: .8rem; color: var(--muted); }
.tile b { font-size: 1.35rem; }
.tile.bad b { color: var(--danger); }
.tile.ok b { color: var(--good); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; }
td.c, th.c { text-align: center; }
tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
.hotcol { background: var(--hot); color: var(--hot-ink); }
input[type=number], input[type=text], textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
textarea { resize: vertical; line-height: 1.35; display: block; min-height: 2.4em; }
td input.w-cell { width: 100%; max-width: 5.5em; min-width: 3.2em; text-align: right; margin-left: auto; display: block; }
table.wip td, table.wip th { padding: 4px 6px; }
table.wip td:first-child { white-space: nowrap; }
table.elements td { vertical-align: middle; }
table.elements th { white-space: nowrap; }
table.elements td.mid { vertical-align: middle; }
table.roles td.c { white-space: nowrap; }
.checklist { columns: 2 300px; column-gap: 28px; }
.checklist label.chk { break-inside: avoid; }
.idle-tall { display: none; }
.cell-head { display: flex; gap: 8px; align-items: center; }
.cell-head .letter { font-size: 1.15rem; font-weight: 800; min-width: 1.4em; }
input.w-num { width: 5.5em; text-align: right; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.chk { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
label.chk input { margin-top: 3px; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgb(0 0 0 / .25); vertical-align: -2px; }

/* Messages */
.msg { padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); }
.msg.bad { border-color: var(--danger); }
.msg.bad b:first-child { color: var(--danger); }
.msg.ok { border-color: var(--good); }
.msg.ok b:first-child { color: var(--good); }
.msg.warn { border-color: var(--warn); }
ul.tight { margin: 4px 0; padding-left: 20px; }
ul.tight li { margin: 2px 0; }

/* Clock */
.big-clock { font-size: clamp(56px, 12vw, 120px); font-weight: 800; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
/* "5:00" is about 1.9 em wide (2.5 em for "10:00"), so 36% of the box width always fits. */
.clock-main, .pilot-live { container-type: inline-size; }
.clock-main .big-clock { font-size: min(clamp(56px, 12vw, 120px), 36cqi); }
.big-clock.ended { color: var(--danger); }
.progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 10px 0; }
.progress > div { height: 100%; background: var(--accent); width: 0; }
.cue { min-height: 2.6em; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); font-weight: 700; }
.cue.flash { background: var(--hot); color: var(--hot-ink); animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.02); } }
.rules { margin: 0; padding-left: 20px; }
.rules li { font-weight: 600; }

/* Counters */
.counter-big { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.counter-big .val { font-size: 3rem; font-weight: 800; min-width: 1.6em; text-align: center; }
.defects { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.defect { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.defect button { border: 0; background: var(--surface); cursor: pointer; }
.defect .add { flex: 1; text-align: left; padding: 8px 10px; }
.defect .add b { display: block; font-size: 1.3rem; }
.defect .sub { padding: 0 10px; border-left: 1px solid var(--border); color: var(--muted); }
.defect button:hover { background: var(--surface-2); }
.log { font-size: .85rem; max-height: 160px; overflow: auto; margin: 0; padding: 0; list-style: none; }
.log li { padding: 3px 0; border-bottom: 1px dashed var(--border); }

/* Idle grid */
.idle-cell { width: 34px; height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 800; }
.idle-cell.on { background: var(--danger); border-color: var(--danger); color: #fff; }
table.idle td, table.idle th { padding: 4px 3px; }
table.idle td:first-child, table.idle th:first-child { padding-left: 8px; }

/* Agenda */
.timeline { display: flex; height: 34px; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid var(--border); margin-top: 12px; }
.timeline button { border: 0; border-right: 1px solid var(--border); background: var(--surface-2); font-size: .72rem; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px; color: var(--muted); }
.timeline button.cur { background: var(--accent); color: var(--accent-ink); }
.timeline .marker { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--danger); pointer-events: none; }
.block { border-left: 5px solid var(--border); }
.block.cur { border-left-color: var(--accent); background: linear-gradient(90deg, var(--surface-2), var(--surface) 40%); }
.block h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.block .when { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.say { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 1.05em; }
.lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin-top: 10px; }
.stall { border: 1px dashed var(--warn); border-radius: 9px; padding: 8px 12px; margin-top: 10px; }
.stall.live { background: var(--hot); color: var(--hot-ink); border-style: solid; }

/* Balance chart */
.bc { --bc-h: 380px; --axis: 38px; --gutter: 72px; margin-top: 8px; }
.bc.compact { --bc-h: 260px; }
.bc-plot { position: relative; height: var(--bc-h); margin-top: 22px; border-bottom: 2px solid var(--text); }
.bc-grid { position: absolute; left: var(--axis); right: 0; border-top: 1px solid var(--border); height: 0; }
.bc-grid span { position: absolute; left: calc(-1 * var(--axis)); width: calc(var(--axis) - 6px); text-align: right; transform: translateY(-50%); font-size: .75rem; color: var(--muted); }
.bc-takt { position: absolute; left: var(--axis); right: 0; height: 0; border-top: 3px solid var(--danger); z-index: 3; pointer-events: none; }
.bc-takt span { position: absolute; right: 0; top: -12px; background: var(--danger); color: #fff; font-size: .75rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.bc-cols { position: absolute; left: var(--axis); right: var(--gutter); top: 0; bottom: 0; display: flex; gap: 8px; padding: 0 6px; }
.bc-col { flex: 1; position: relative; max-width: 130px; margin: 0 auto; border-radius: 8px 8px 0 0; }
.bc-col.drop-ok { background: color-mix(in srgb, var(--accent) 14%, transparent); outline: 2px dashed var(--accent); }
.bc-stack { position: absolute; left: 8%; right: 8%; bottom: 0; height: 100%; display: flex; flex-direction: column-reverse; }
.bc-card { flex: none; border: 1px solid rgb(0 0 0 / .35); border-bottom-width: 0; color: var(--card-ink); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 3px; font-size: 12px; line-height: 1.1; }
.bc-card:first-child { border-bottom-width: 1px; }
.bc-card b { font-size: 15px; }
.bc-card .n { font-size: 10px; opacity: .8; }
.bc.interactive { user-select: none; -webkit-user-select: none; }
.bc.interactive .bc-card { cursor: grab; touch-action: none; }
.bc.interactive .bc-card:hover { filter: brightness(1.06); box-shadow: inset 0 0 0 2px rgb(0 0 0 / .45); }
.bc-card.drag-src { opacity: .3; }
.bc-card.carry { box-shadow: inset 0 0 0 3px var(--accent); filter: brightness(1.08); }
.bc-ghost { position: fixed; z-index: 100; overflow: visible !important; pointer-events: none; border: 1px solid rgb(0 0 0 / .45) !important; border-radius: 4px; box-shadow: 0 12px 30px rgb(0 0 0 / .3); transform: rotate(-2deg); opacity: .95; }
.ghost-tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
body.bc-dragging, body.bc-dragging * { cursor: grabbing !important; }
.bc-card.selected { box-shadow: inset 0 0 0 3px var(--accent); }
.bc-col.over .bc-card { border-color: var(--danger); }
.bc-wait { flex: none; border: 1px dashed var(--muted); border-bottom: 0; background: repeating-linear-gradient(45deg, transparent 0 6px, color-mix(in srgb, var(--muted) 22%, transparent) 6px 8px); }
.bc-total { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: .9rem; transform: translateY(-2px); }
.bc-col.over .bc-total { color: var(--danger); }
.bc-labels { display: flex; gap: 8px; padding: 6px calc(var(--gutter) + 6px) 0 calc(var(--axis) + 6px); }
.bc-labels div { flex: 1; max-width: 130px; margin: 0 auto; text-align: center; font-weight: 700; font-size: .9rem; }
.bc.compact .bc-card .n { display: none; }
/* Narrow charts (suggestion previews, phones): letters only, labels on one line. */
.bc { container-type: inline-size; }
.bc-total, .bc-labels div { white-space: nowrap; }
@container (max-width: 440px) {
  .bc-card span, .bc-card .n { display: none; }
  .bc-card b { font-size: 12px; }
  .bc-total { font-size: .72rem; }
  .bc-labels div { font-size: .72rem; }
  .bc-takt span { font-size: .68rem; }
}
.strip { display: flex; flex-wrap: wrap; align-items: stretch; row-gap: 8px; margin-top: 8px; }
.chip { color: var(--card-ink); border: 1px solid rgb(0 0 0 / .3); border-radius: 6px; padding: 4px 8px; font-weight: 700; font-size: .85rem; text-align: center; min-width: 42px; }
.chip small { display: block; font-weight: 500; font-size: .72rem; }
.gap { width: 18px; border: 0; background: none; cursor: pointer; position: relative; padding: 0; }
.gap::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; transform: translateX(-50%); background: var(--border); }
.gap:hover::after { background: var(--accent); }
.gap.cut { width: 26px; }
.gap.cut::after { width: 5px; background: var(--text); top: -2px; bottom: -2px; border-radius: 3px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Charts (SVG) */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 12px; }
svg.chart text.v { fill: var(--text); font-weight: 700; }
svg.chart .grid line { stroke: var(--border); }
svg.chart .axis { stroke: var(--text); }
.f-r1 { fill: var(--r1); } .f-r2 { fill: var(--r2); }
.s-r1 { stroke: var(--r1); } .s-r2 { stroke: var(--r2); }
.f-dns { fill: url(#hatch); }
.ref { stroke: var(--danger); stroke-width: 2; stroke-dasharray: 6 4; }
i.k-r1 { background: var(--r1); } i.k-r2 { background: var(--r2); }

/* Metrics board */
.mb td, .mb th { padding: 10px; font-size: 1.02rem; }
.mb td.chg.good { color: var(--good); font-weight: 700; }
.mb td.chg.bad { color: var(--danger); font-weight: 700; }
.mb td.biggest span { border: 3px solid var(--danger); border-radius: 50%; padding: 4px 10px; display: inline-block; }

/* Toast */
#toast:not(.show) { visibility: hidden; opacity: 0; }
#toast { pointer-events: none; position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(150%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-weight: 700; z-index: 50; transition: transform .25s, opacity .25s; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.cue { background: var(--hot); color: var(--hot-ink); border: 2px solid var(--warn); }
#toast.bad { border: 2px solid var(--danger); }

/* LAN mode: share panel on the facilitator's screen, focused views on phones */
.net-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); }
.net-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.net-pill.ok i { background: var(--good); }
.net-pill.warn i { background: var(--warn); }
.net-pill.bad i { background: var(--danger); }
.share-panel { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
.share-qr svg { display: block; width: 220px; height: 220px; border-radius: 8px; }
.share-info { flex: 1; min-width: 240px; }
.share-info .msg { margin: 8px 0; }
.share-url { font-size: 1.4rem; font-weight: 800; word-break: break-all; margin: 2px 0 12px; }
.presence { list-style: none; padding: 0; margin: 4px 0 8px; display: grid; gap: 2px; }
.presence .off { color: var(--muted); }
body.projector .share-qr svg { width: min(46vh, 420px); height: min(46vh, 420px); }
body.projector .share-url { font-size: 2.2rem; }
.join-roles { display: grid; gap: 10px; margin-top: 14px; }
.join-role { display: grid; gap: 3px; text-align: left; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: inherit; font: inherit; cursor: pointer; }
.join-role:hover { border-color: var(--accent); }
.join-role:active { background: var(--surface-2); }
.join-role b { font-size: 1.1rem; }
.join-role .who { color: var(--accent); font-weight: 600; }
.join-bar { margin-bottom: 12px; }
.join-bar .row { align-items: center; }
.join-clock { font-size: clamp(2.6rem, 15vw, 4.5rem); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.join-clock.ended { color: var(--danger); }
.join-bar .progress { margin: 8px 0 10px; }
.join-body > section { margin-bottom: 12px; }
body.joiner main { max-width: 680px; }
body.joiner .idle-wide { display: none; }
body.joiner .idle-tall { display: block; }
body.joiner .mini { display: none !important; }
body.joiner table.wip, body.joiner table.idle { width: 100%; }
body.joiner .idle-tall table.idle td, body.joiner .idle-tall table.idle th { padding: 4px 2px; }
body.joiner .idle-cell { width: 100%; min-width: 28px; height: 40px; }
body.joiner .defects .add { min-height: 60px; }
body.joiner table.wip td { padding: 4px 3px; }
body.joiner .w-cell { width: 100%; min-width: 2.4em; font-size: 1.1rem; padding: 8px 6px; }

/* Projector mode */
body.projector { font-size: 19px; }
body.projector .no-proj { display: none !important; }
body.projector main { max-width: none; }
body.projector .clock-main .big-clock { font-size: min(36cqi, 34vh); }
body.projector .big-clock.pilot-clock { font-size: min(30cqi, 24vh); }
/* Projector: the countdown gets the whole top row, clock on the left, cue and rules beside it. */
@media (min-width: 800px) {
  body.projector .grid.run > .clock-card { grid-column: 1 / -1; display: flex; gap: 32px; align-items: center; }
  body.projector .grid.run > .clock-card > .clock-main { flex: 0 0 62%; }
  body.projector .grid.run > .clock-card > .clock-side { flex: 1; min-width: 0; }
  body.projector .grid.run > .idle-card { grid-column: 1 / -1; }
}
@media (min-width: 800px) and (max-width: 1199px) {
  body.projector .grid.run > .wip-card { grid-column: 1 / -1; }
}
body.projector .bc { --bc-h: 58vh; }
body.projector .bc-card { font-size: 15px; }

<script>
'use strict';

/* ============================================================
   1. Defaults — taken from "Paper Airplane Lean Flow Game.docx"
   ============================================================ */
const STORE_KEY = 'paperAirplaneFlowGame.v1';
const PALETTE = [
  { name: 'Yellow', hex: '#f6d55c' }, { name: 'Green', hex: '#94d48f' }, { name: 'Blue', hex: '#8fbdf0' },
  { name: 'Pink', hex: '#f4a7c8' }, { name: 'Orange', hex: '#f7b36f' }, { name: 'White', hex: '#ffffff' },
  { name: 'Purple', hex: '#c9adf2' }, { name: 'Teal', hex: '#86d9d1' },
];
const DEFAULT_ELEMENTS = [
  { id: 'A', name: 'Crease the center fold and unfold', step: 'Fold the sheet in half the long way, crease hard, unfold', time: 8, r1: 1 },
  { id: 'B', name: 'Fold the top-left corner to center', step: 'Fold the top-left corner down to the center crease', time: 6, r1: 1 },
  { id: 'C', name: 'Fold the top-right corner to center', step: 'Fold the top-right corner down to the center crease', time: 6, r1: 1 },
  { id: 'D', name: 'Fold the left edge to center', step: 'Fold the new left slanted edge to the center crease', time: 7, r1: 2 },
  { id: 'E', name: 'Fold the right edge to center', step: 'Fold the new right slanted edge to the center crease', time: 7, r1: 2 },
  { id: 'F', name: 'Fold in half along the center', step: 'Fold the plane in half along the center crease, folds on the outside', time: 6, r1: 3 },
  { id: 'G', name: 'Fold the left wing down', step: 'Fold the left wing down so its top edge meets the bottom of the body', time: 10, r1: 3 },
  { id: 'H', name: 'Fold the right wing down to match', step: 'Flip over and fold the right wing down to match the left', time: 12, r1: 3 },
  { id: 'I', name: 'Draw the logo on the left wing', step: 'Draw the logo (circle with "L") near the left wingtip', time: 15, r1: 4 },
  { id: 'J', name: 'Draw the logo on the right wing', step: 'Draw the logo near the right wingtip, same spot', time: 15, r1: 4 },
  { id: 'K', name: 'Tape the top of the fuselage', step: 'Put one piece of tape across the top of the body', time: 12, r1: 4 },
  { id: 'L', name: 'Write the serial number on the body', step: 'Write the next serial number on the body (01, 02, 03…)', time: 8, r1: 5 },
  { id: 'M', name: 'Final inspection and checkmark', step: "Check the plane against the golden plane, checkmark the tail, place in the customer's outbox", time: 10, r1: 6 },
];
const ANSWER_KEY = [['A', 'B', 'C', 'D'], ['E', 'F', 'G'], ['H', 'I'], ['J', 'K'], ['L', 'M']];
const CHECKS = [
  { key: 'nose', label: 'Nose', accept: 'Sharp point, folds meet the center crease', reject: 'Blunt, off-center, or torn' },
  { key: 'wings', label: 'Wings', accept: 'Both wings the same width, within about 1/4 in', reject: 'Visibly lopsided' },
  { key: 'logo', label: 'Logo', accept: 'A circle with "L" inside, near each wingtip, same spot both sides', reject: 'Missing, smeared, or on one wing only' },
  { key: 'tape', label: 'Tape', accept: 'One piece across the top of the fuselage, holding the body closed', reject: 'Missing or loose' },
  { key: 'serial', label: 'Serial number', accept: 'Written on the body, legible, numbered in order (01, 02, 03…)', reject: 'Missing or unreadable' },
  { key: 'inspection', label: 'Inspection mark', accept: 'A checkmark from the inspector on the tail', reject: 'Missing' },
];
/* Lists that depend on the game size are functions of the derived model `d`. Item order stays fixed so saved checkboxes still line up. */
const materialsFor = d => {
  const n1 = d.r1.length, n2 = Math.max(1, n1 - 1), B = d.c.batchSize;
  return [
    '80 sheets of 8.5 × 11 printer paper (preload WIP, both rounds, spares)',
    '4 fine-tip markers (logo stations), 1 for the serial number station',
    '2 tape dispensers',
    '1 golden plane, built and labeled "GOLDEN — DO NOT SHIP"',
    `Station sheets for Round 1 (${n1}) and Round 2 (${n2}), printed and laminated`,
    `${d.c.elements.length} element cards, cut to scale (1 cm = 2 s)`,
    "Whiteboard or flip chart, red tape for the takt line, painter's tape for the cards",
    '1 stopwatch, 4 sticky tags for lead-time tracking',
    'Metrics board on a flip chart, 2 observer tally sheets, pens',
    `${n1} tables or stations in a straight line with inbox spots marked by tape`,
    `Round 1 WIP preloaded the day before (${B * (n1 - 1)} partial planes)`,
  ];
};
const SUPPORT_ROLES = 6;
const rolesFor = d => {
  const n1 = d.r1.length, n2 = Math.max(1, n1 - 1);
  return [
    { key: 'operators', label: 'Operators', r1: `${n1} (S1–S${n1})`, r2: `${n2} (Op 1–Op ${n2})`, job: 'Build per the station sheet' },
    { key: 'customer', label: 'Customer', r1: '1', r2: '1', job: 'Pulls finished planes, accepts or rejects against the golden plane' },
    { key: 'quality', label: 'Quality checker', r1: '1', r2: '1', job: 'Logs every defect on the metrics board' },
    { key: 'timekeeper', label: 'Timekeeper', r1: '1', r2: '1', job: 'Runs the clock, starts and stops the tagged plane' },
    { key: 'wip', label: 'WIP observer', r1: '1', r2: '1', job: `Counts planes between stations at ${wipTimes(d.c).map(fmtClock).join(', ')}` },
    { key: 'idle', label: 'Idle observer', r1: '1', r2: '1', job: 'Tallies operators waiting or starved' },
    { key: 'material', label: 'Material handler', r1: '1', r2: String(1 + n1 - n2), job: `Keeps paper, markers and tape stocked; in Round 2 the freed operator${n1 - n2 > 1 ? 's join' : ' joins'} as water spider` },
  ];
};

/* Facilitator script. Functions receive derived values so numbers follow the setup. */
const AGENDA = [
  { id: 'kickoff', len: 180, title: 'Kickoff',
    say: d => [`"Our customer wants ${d.c.demand} good planes in ${fmtMin(d.c.roundSeconds)}. That's one plane every ${fmtNum(d.T)} seconds. That number is takt time, the heartbeat of the line."`,
               `Show the golden plane. "Anything that doesn't match this is scrap."`],
    do: () => ['Hand out role cards and Round 1 station sheets.', 'Tag one plane in the S1 inbox.'] },
  { id: 'r1', len: 'round', title: 'Round 1: Batch and push',
    rules: d => roundRules(1, d),
    say: () => ['"The line is already running. Go." Start the clock.'],
    do: d => ["Timekeeper records the tagged plane's finish time.", `WIP observer counts at ${fmtClock(d.c.roundSeconds / 2)} and ${fmtClock(d.c.roundSeconds)}.`, `Stop at ${fmtClock(d.c.roundSeconds)} sharp. Nobody moves a plane.`],
    link: { label: 'Open Round 1 timer', tab: 'run', round: 1 } },
  { id: 'debrief', len: 180, title: 'Round 1 debrief',
    do: () => ['Fill in the Round 1 column of the metrics board together.'],
    ask: d => {
      const bn = splitStats(d, d.r1).bottleneck, after = d.r1.map((_, i) => 'S' + (i + 1)).slice(bn + 1);
      return [`"Where did planes pile up?" (S${bn + 1})`, `"Who was standing around?" (${after.join(', ') || 'the stations after the pile-up'})`, '"How long did the tagged plane take?"'];
    },
    say: () => ['"Did anyone work slowly? No. The line was set up to fail. Let\'s see why."'],
    link: { label: 'Show metrics board', tab: 'results' } },
  { id: 'chart', len: 300, title: 'Build the balance chart',
    do: () => ['Hand each Round 1 operator the element cards for their station.', 'Each operator tapes their cards in a stack above their station number.'],
    say: () => ['Point at the red line. "Every stack above this line can\'t keep up with the customer. Every stack way below it is waiting."'],
    link: { label: 'Show Round 1 balance chart', tab: 'balance', mode: 'r1' } },
  { id: 'level', len: 240, title: 'Level the load',
    say: d => ['"Move cards so every stack is under the red line. Cards must stay in build order, A through M."',
               `"The ${ordinal(d.r1.length)} person isn't cut. They become our water spider: keeping stock full and fixing problems so operators never stop."`],
    do: d => [`Let them find that ${d.N} stacks are enough. Don't give the answer unless they stall at ${fmtClock(stallAt(d.c))}.`, 'Swap in the Round 2 station sheets that match their solution, or the answer key if close enough.'],
    stall: true,
    link: { label: 'Open rebalance board', tab: 'balance', mode: 'rebalance' } },
  { id: 'r2', len: 'round', title: 'Round 2: One-piece flow',
    do: d => [`Clear Round 1 WIP. Preload 1 partial plane at the Op 2–Op ${d.r2.length} inboxes (${d.r2.length - 1} total) and blank paper at Op 1.`, `Tag a new plane, start the clock, stop at ${fmtClock(d.c.roundSeconds)} sharp.`],
    rules: d => roundRules(2, d),
    link: { label: 'Open Round 2 timer', tab: 'run', round: 2 } },
  { id: 'close', len: 300, title: 'Compare and close',
    do: () => ['Fill in the Round 2 column. Circle the biggest change (the metrics board circles it for you).', 'Go around the room: one takeaway each.'],
    ask: () => ['"Where on our real line is there an S4? What would a balance chart of your cell look like?"'],
    note: 'If time runs short: cut the go-around to 3 volunteers; never cut the balance chart build.',
    link: { label: 'Show metrics board', tab: 'results' } },
];
/* Block start and end times follow the round length (the doc's 30:00 assumes 5:00 rounds). */
function agendaFor(c) {
  let t = 0;
  return AGENDA.map(b => { const len = b.len === 'round' ? c.roundSeconds : b.len; const o = { ...b, start: t, end: t + len }; t += len; return o; });
}
const sessionLen = c => { const a = agendaFor(c); return a[a.length - 1].end; };
const stallAt = c => agendaFor(c).find(b => b.id === 'level').start + 150;
const setupStepsFor = d => {
  const n1 = d.r1.length, B = d.c.batchSize, bn = splitStats(d, d.r1).bottleneck;
  return [
    `Line up ${n1} stations with a taped inbox spot between each.`,
    `Preload Round 1 WIP: a stack of ${B} at the S2–S${n1} inboxes, each already built through the prior station's work (${B * (n1 - 1)} partial planes), plus blank paper at S1.`,
    'Post the metrics board, the empty balance chart board with the red takt line, and the golden plane where everyone can see them.',
    `Pilot the build before game day on the Card times tab, and use its checks and suggestions so S${bn + 1} stays well over takt late in the line.`,
  ];
};

/* ============================================================
   2. Pure helpers and calculations
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const isNum = v => typeof v === 'number' && isFinite(v);
const clone = o => JSON.parse(JSON.stringify(o));
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec + 1e-6)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function fmtNum(v) { return isNum(v) ? (Math.round(v * 10) / 10).toString() : '—'; }
function fmtMin(sec) { return sec % 60 === 0 ? `${sec / 60} minute${sec === 60 ? '' : 's'}` : fmtClock(sec); }
function ordinal(n) { return ['zeroth', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth'][n] || n + 'th'; }

const takt = c => c.roundSeconds / c.demand;
const workContent = c => c.elements.reduce((s, e) => s + (isNum(+e.time) ? +e.time : 0), 0);
const operatorsNeeded = c => Math.ceil(workContent(c) / takt(c) - 1e-9);
const elementMap = c => Object.fromEntries(c.elements.map(e => [e.id, e]));
const stackLoad = (map, stack) => stack.reduce((s, id) => s + (map[id] ? +map[id].time || 0 : 0), 0);

function r1Stations(c) {
  const nums = [...new Set(c.elements.map(e => +e.r1 || 1))].sort((a, b) => a - b);
  return nums.map(n => c.elements.filter(e => (+e.r1 || 1) === n).map(e => e.id));
}
function validSplit(els, stacks) {
  if (!Array.isArray(stacks) || !stacks.length) return false;
  if (stacks.some(s => !Array.isArray(s) || !s.length)) return false;
  return stacks.flat().join('|') === els.map(e => e.id).join('|');
}
function cutsFromStacks(stacks) { const cuts = []; let k = 0; for (let i = 0; i < stacks.length - 1; i++) { k += stacks[i].length; cuts.push(k); } return cuts; }
function stacksFromCuts(ids, cuts) {
  const cs = [...new Set(cuts)].filter(k => k > 0 && k < ids.length).sort((a, b) => a - b);
  const out = []; let prev = 0;
  for (const k of cs) { out.push(ids.slice(prev, k)); prev = k; }
  out.push(ids.slice(prev));
  return out;
}
function toggleCut(stacks, k) {
  const ids = stacks.flat(); const cuts = cutsFromStacks(stacks);
  const i = cuts.indexOf(k);
  if (i >= 0) cuts.splice(i, 1); else cuts.push(k);
  return stacksFromCuts(ids, cuts);
}
/* Move card `id` onto stack `j`. Cards must stay in A–M order, so every card between
   `id` and stack j moves with it, and any station emptied on the way disappears.
   Returns { stacks, moved } or null when nothing would change. */
function moveTo(stacks, id, j) {
  const i = stacks.findIndex(st => st.includes(id));
  if (i < 0 || j === i || j < 0 || j >= stacks.length) return null;
  const ids = stacks.flat(), x = ids.indexOf(id), cuts = cutsFromStacks(stacks);
  const start = k => (k === 0 ? 0 : cuts[k - 1]);
  let next, moved;
  if (j > i) { /* id becomes the first card of stack j */
    moved = ids.slice(x, start(j));
    next = cuts.filter(c => c <= x || c > start(j)).concat([x]);
  } else {     /* id becomes the last card of stack j */
    moved = ids.slice(cuts[j], x + 1);
    next = cuts.filter(c => c < cuts[j] || c > x).concat([x + 1]);

  return { stacks: stacksFromCuts(ids, next), moved };
}
function splitStats(d, stacks) {
  const loads = stacks.map(st => stackLoad(d.map, st));
  const maxLoad = Math.max(...loads);
  const n = stacks.length;
  return {
    loads, n, maxLoad, bottleneck: loads.indexOf(maxLoad),
    over: loads.map((l, i) => (l > d.T + 1e-9 ? i : -1)).filter(i => i >= 0),
    capacity: maxLoad > 0 ? Math.floor(d.c.roundSeconds / maxLoad + 1e-9) : 0,
    efficiency: maxLoad > 0 ? d.W / (n * maxLoad) : 0,
  };
}

function newClock() { return { accum: 0, startedAt: null }; }
/* On a phone in LAN mode, clocks were started on the facilitator's laptop: clockSkew converts this device's time to the laptop's. */
let clockSkew = 0;
function clockElapsed(cl) { return (cl.accum + (cl.startedAt ? Date.now() + clockSkew - cl.startedAt : 0)) / 1000; }
function clockStart(cl) { if (!cl.startedAt) cl.startedAt = Date.now(); }
function clockPause(cl) { if (cl.startedAt) { cl.accum += Date.now() - cl.startedAt; cl.startedAt = null; } }
function clockSet(cl, sec) { cl.accum = Math.max(0, sec) * 1000; if (cl.startedAt) cl.startedAt = Date.now(); }

const scanCount = c => Math.max(1, Math.floor(c.roundSeconds / c.idleInterval + 1e-9));
const wipTimes = c => [0, c.roundSeconds / 2, c.roundSeconds];
function roundCues(c) {
  const R = c.roundSeconds, cues = [];
  cues.push({ id: 'wip0', t: 0, kind: 'wip', col: 0 });
  cues.push({ id: 'wip1', t: R / 2, kind: 'wip', col: 1 });
  cues.push({ id: 'wip2', t: R, kind: 'end', col: 2 });
  for (let k = 1; k <= scanCount(c); k++) cues.push({ id: 'idle' + k, t: k * c.idleInterval, kind: 'idle', scan: k - 1 });
  return cues.sort((a, b) => a.t - b.t);
}
function cueMessage(fired, c) {
  const t = Math.max(...fired.map(f => f.t)), N = scanCount(c);
  if (fired.some(f => f.kind === 'end')) return `${fmtClock(t)}. STOP, nobody moves a plane. Count WIP and do the last idle scan.`;
  const parts = [];
  if (fired.some(f => f.id === 'wip0')) parts.push('Round started. Confirm the 0:00 WIP preload counts');
  else if (fired.some(f => f.kind === 'wip')) parts.push('WIP count now');
  const idle = fired.filter(f => f.kind === 'idle').pop();
  if (idle) parts.push(`idle scan ${idle.scan + 1} of ${N}: tap anyone waiting or blocked`);
  return `${fmtClock(t)}. ${parts.join(' + ')}.`;
}

function leadTime(r, c) {
  if (isNum(r.taggedStart) && isNum(r.taggedShip)) return { value: Math.max(0, r.taggedShip - r.taggedStart), dns: false };
  if (r.didNotShip) return { value: null, dns: true, floor: c.roundSeconds };
  return { value: null, dns: false };
}
const defectTotal = r => CHECKS.reduce((s, k) => s + (r.defects[k.key] || 0), 0);
function wipKeys(n) { const k = []; for (let i = 2; i <= n; i++) k.push('in' + i); k.push('out'); return k; }

/* ============================================================
   2c. Card-time design: best split, design checks, auto-fit, pilot timing
   ============================================================ */
const DESIGN_DEFAULTS = { slack: 2, margin: 8 };
const designTargets = c => ({ ...DESIGN_DEFAULTS, ...(c.design || {}) });
const sumOf = a => a.reduce((x, y) => x + y, 0);
/* "Late in the line": the back half, with at least one station after it (S4–S5 of 6, as in the doc). */
const lateRange = n1 => [Math.floor(n1 / 2), n1 - 2];

/* Contiguous split of `t` (times in build order) into N stacks.
   solveSplit(t, N, cost, cap) minimizes cost over splits whose stacks are all ≤ cap. */
function solveSplit(t, N, cost, cap = Infinity) {
  const n = t.length;
  if (N < 1 || N > n) return null;
  const pre = [0]; for (const x of t) pre.push(pre[pre.length - 1] + x);
  let prev = new Array(n + 1).fill(null); prev[0] = { v: 0, cuts: [] };
  for (let k = 1; k <= N; k++) {
    const cur = new Array(n + 1).fill(null);
    for (let i = k; i <= n - (N - k); i++) {
      for (let j = k - 1; j < i; j++) {
        const p = prev[j], s = pre[i] - pre[j];
        if (!p || s > cap + 1e-9) continue;
        const v = cost(p.v, s);
        if (!cur[i] || v < cur[i].v - 1e-9) cur[i] = { v, cuts: j > 0 ? [...p.cuts, j] : [] };
      }
    }
    prev = cur;
  }
  return prev[n];
}
/* Smallest possible largest stack; ties go to the most even split (lowest sum of squares). */
function bestSplit(t, N) {
  const a = solveSplit(t, N, (v, s) => Math.max(v, s));
  if (!a) return null;
  const b = solveSplit(t, N, (v, s) => v + s * s, a.v);
  return { max: a.v, cuts: b.cuts };
}
/* Total seconds above `top`, minimized over splits: zero exactly when some split fits. */
/* Same DP as solveSplit but value-only on typed arrays: auto-fit calls this thousands of times per search. */
function minExcess(t, N, top) {
  const n = t.length;
  if (N < 1 || N > n) return Infinity;
  const pre = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + t[i];
  let prev = new Float64Array(n + 1).fill(Infinity); prev[0] = 0;
  for (let k = 1; k <= N; k++) {
    const cur = new Float64Array(n + 1).fill(Infinity);
    for (let i = k; i <= n - (N - k); i++) {
      let best = Infinity;
      for (let j = k - 1; j < i; j++) {
        const p = prev[j]; if (p === Infinity) continue;
        const sgm = pre[i] - pre[j], v = p + (sgm > top ? sgm - top : 0);
        if (v < best) best = v;
      }
      cur[i] = best;
    }
    prev = cur;
  }
  return prev[n];
}

  const ids = c.elements.map(e => e.id), map = elementMap(c), top = takt(c) - designTargets(c).slack;

  /* Keep the doc's key while it still fits with the same slack the design check asks for; otherwise use the best split. */
  if (validSplit(c.elements, ANSWER_KEY) && ANSWER_KEY.length === N && ANSWER_KEY.every(s => stackLoad(map, s) <= top + 1e-9)) return ANSWER_KEY;
  const b = bestSplit(ids.map(id => +map[id].time || 0), N);

/* The five rules a working game needs, each with a specific fix. Works on any config, so it can check proposals too. */

    validSplit(els, r1) ? `${n1} stations: ${r1.map((s, i) => `S${i + 1} ${s.join('')}`).join(' · ')}` : 'An R1 station number goes down somewhere between A and M.',

    W > hi ? `Trim ${fmtNum(W - hi)} s in total, for example from the longest cards (${biggest}).` : `Add ${fmtNum(lo + 1 - W)} s in total, or the team will find ${needOps} operators is enough.`);

    `Longest card: ${longest.id} at ${fmtNum(+longest.time)} s (limit ${fmtNum(top)} s).`,

    b ? `Best split: ${stacks.map((s, i) => `Op ${i + 1} ${s.join('+')} = ${fmtNum(loads[i])} s`).join(' · ')}. Each stack must be ${fmtNum(top)} s or less (${fmtNum(tg.slack)} s under takt, so the team has room).`

    over.map(x => `Op ${x.i + 1} (${x.s.join('+')}) is ${fmtNum(x.load - top)} s over: trim ${x.s.length > 1 ? 'one of ' + x.s.join(', ') : x.s[0]} by ${fmtNum(x.load - top)} s`).join('; ') + '.');

  others.forEach(x => bnFix.push(`bring S${x.i + 1} (${fmtNum(x.l)} s) down to ${fmtNum(T)} s or less`));
  add('bottleneck', !bnFix.length, 'Round 1 has one clear bottleneck, late in the line',
    `S${bi + 1} of ${n1} = ${fmtNum(bmax)} s, ${fmtNum(bmax - T)} s over takt; it needs at least ${fmtNum(tg.margin)} s over (${fmtNum(need)} s). ` +
    (lateHi >= lateLo ? `It belongs at ${lateTxt}, so planes pile up mid-line and the last stations sit waiting` : 'Round 1 needs at least 3 stations') +
    (others.length ? `. Also over takt: ${others.map(x => `S${x.i + 1}`).join(', ')}` : '') + '.',

/* Whole-second card times as close as possible to `base` (measured) that pass every design check.

    const e = clockElapsed(r.clock);

    if (e >= R) {

}

function netConnect() {

  const es = NET.es = new EventSource('/api/events?' + q);

/* Clock offsets: each device estimates (server clock − own clock) from server timestamps,

  if (!isNum(t)) return;
  NET.offs.push(t - Date.now()); if (NET.offs.length > 12) NET.offs.shift();
  NET.off = Math.max(...NET.offs);

}

/* ---- host side ---- */

}

  const body = JSON.stringify({ shared, liveRound: state.ui.runRound, hostOff: NET.off, seq: ++NET.seq });
  fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Host-Token': NET.token }, body })
    .then(res => { if (res.status === 403 && NET.status === 'live') { NET.token = null; netConnect(); } }) /* stale token after a server restart */
    .catch(() => { /* the EventSource reports the outage */ })

}
function netOnRemote(m) {

      const n = state.ui.runRound, r = state.rounds[n];
      ensureRound(n, derive(state));
      const data = m.data && typeof m.data === 'object' ? m.data : {};
      if (JOIN_ACTIONS[m.action](data, r)) runAction(m.action, data);
    } else if (m.kind === 'bind' && typeof m.path === 'string' && JOIN_BIND.test(m.path)) {
      const v = m.v;
      if (m.path.endsWith('didNotShip') ? typeof v !== 'boolean' : !(v === null || (isNum(v) && v >= 0))) return;

}

/* ---- joiner side ---- */
function netApplyState(m) {
  netClockSample(m.t);

  if (!msg || !msg.shared) return;
  NET.hostOff = isNum(msg.hostOff) ? msg.hostOff : 0;
  clockSkew = NET.off - NET.hostOff;
  const next = normalize({ ...msg.shared, ui: state.ui });
  next.ui.runRound = msg.liveRound === 2 ? 2 : 1;
  /* Keep what this phone just typed until the host's copy catches up. */
  for (const [path, p] of Object.entries(NET.pending)) {
    if (p.until < Date.now() || getPath(next, path) === p.v) delete NET.pending[path];
    else try { setPath(next, path, p.v); } catch (e) { delete NET.pending[path]; }

}
function netSendAction(action, dataset) {

  for (const [k, v] of Object.entries(dataset)) if (k !== 'action' && k !== 'confirm') data[k] = v;

function netSendBind(path, v, delay = 300) {

  eq('Round 1 bottleneck is S4', splitStats(d, d.r1).bottleneck, 3);

  eq('move top card K left onto S3 carries I, J', moveTo(d.r1, 'K', 2).moved, ['I', 'J', 'K']);
